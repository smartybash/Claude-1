<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 990" width="1400" height="990" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<style>
  .bg{fill:#111318}
  .ttl{fill:#eef2f7;font-size:26px;font-weight:600}
  .sub{fill:#e6ba58;font-size:14px}
  .pan{fill:#16181c;stroke:#6e7888;stroke-width:1}
  .h{fill:#eef2f7;font-size:17px;font-weight:600}
  .t{fill:#dfe4ec;font-size:13px}
  .ts{fill:#9aa4b2;font-size:11.5px}
  .lg{fill:#38be82}.sh{fill:#e46a52}.ib{fill:#8ab0e8}.tg{fill:#78c8f0}
  .lgs{stroke:#38be82}.shs{stroke:#e46a52}.ibs{stroke:#8ab0e8}
  .tgs{stroke:#78c8f0}.sts{stroke:#e46a52}
  .band{fill:#e6ba58;fill-opacity:.17}
  .ibz{fill:#8ab0e8;fill-opacity:.07}
  .dash{stroke-dasharray:5 4}
  .can{stroke-width:1.6}
</style>
<rect class="bg" x="0" y="0" width="1400" height="990"/>
<text class="ttl" x="34" y="42">IB 1R — the frozen candidate. Display only, no orders.</text>
<text class="sub" x="34" y="66">Failed the concentration audit: the top decile carries 164% of total R and the other 616 of 685 trades lose money in aggregate. Small size. The log is the deliverable, not the P&amp;L.</text>

<!-- ================= LEFT: QUALIFIED LONG ================= -->
<rect class="pan" x="28" y="86" width="660" height="500" rx="4"/>
<text class="h" x="48" y="114">QUALIFIED LONG — the LOW formed first, so expect the break UP</text>

<!-- IB window shading -->
<rect class="ibz" x="112" y="170" width="200" height="250"/>
<text class="ts" x="112" y="163">IB WINDOW 09:30–10:30 ET</text>
<line class="ibs dash" x1="312" y1="150" x2="312" y2="470" stroke-width="1"/>
<text class="ts" x="318" y="163">10:30 — decide here</text>

<!-- IBH / IBL -->
<line class="ibs" x1="112" y1="170" x2="640" y2="170" stroke-width="2"/>
<text class="ib" x="500" y="164" font-size="12.5">IBH = expected break level = ENTRY trigger</text>
<line class="ibs" x1="112" y1="420" x2="640" y2="420" stroke-width="2"/>
<text class="ib" x="500" y="437" font-size="12.5">IBL = STOP</text>

<!-- the low formed first marker -->
<circle class="lg" cx="150" cy="420" r="6"/>
<text class="lg" x="126" y="455" font-size="12">LOW FIRST 09:41</text>
<circle class="ib" cx="268" cy="170" r="5"/>
<text class="ts" x="236" y="192">high 10:12</text>

<!-- qualifying band 0-25% measured DOWN from IBH -->
<rect class="band" x="112" y="170" width="528" height="62"/>
<text class="ts" x="352" y="208">0–25% qualifying band (0% at IBH, 100% at IBL)</text>

<!-- candles, schematic -->
<g class="can lgs">
  <line x1="136" y1="300" x2="136" y2="380"/><line x1="152" y1="360" x2="152" y2="420"/>
  <line x1="172" y1="330" x2="172" y2="400"/><line x1="192" y1="270" x2="192" y2="350"/>
  <line x1="212" y1="240" x2="212" y2="310"/><line x1="232" y1="215" x2="232" y2="280"/>
  <line x1="252" y1="185" x2="252" y2="245"/><line x1="268" y1="170" x2="268" y2="225"/>
  <line x1="286" y1="182" x2="286" y2="228"/><line x1="304" y1="176" x2="304" y2="214"/>
</g>
<circle cx="308" cy="196" r="5" fill="#eef2f7"/>
<text class="t" x="318" y="238" font-size="12">10:30 close sits INSIDE the band</text>
<text class="ts" x="318" y="255">EZ = 100 × |close − IBH| ÷ (IBH − IBL) = 10.4%  →  QUALIFIED</text>

<!-- entry after 10:30 -->
<g class="can lgs">
  <line x1="340" y1="160" x2="340" y2="205"/><line x1="360" y1="140" x2="360" y2="180"/>
  <line x1="382" y1="126" x2="382" y2="166"/>
</g>
<circle class="lg" cx="340" cy="168" r="6"/>
<text class="lg" x="348" y="130" font-size="12.5">ENTRY — first bar after 10:30 whose HIGH exceeds IBH</text>
<text class="ts" x="348" y="146">fill = max(IBH, bar open)</text>

<!-- target -->
<line class="tgs" x1="112" y1="56" x2="640" y2="56" stroke-width="2"/>
<text class="tg" x="500" y="50" font-size="12.5">hidden</text>
<line class="tgs" x1="340" y1="90" x2="640" y2="90" stroke-width="2"/>
<text class="tg" x="452" y="84" font-size="12.5">1R TARGET = fill + (fill − IBL)</text>
<line class="sts dash" x1="340" y1="420" x2="640" y2="420" stroke-width="1.5"/>
<text class="sh" x="452" y="412" font-size="12.5">risk = fill − IBL</text>
<line class="lgs dash" x1="620" y1="90" x2="620" y2="420" stroke-width="1"/>
<text class="ts" x="560" y="470">flat 16:00 ET if neither is hit</text>

<!-- ================= RIGHT: QUALIFIED SHORT ================= -->
<rect class="pan" x="712" y="86" width="660" height="500" rx="4"/>
<text class="h" x="732" y="114">QUALIFIED SHORT — the HIGH formed first, so expect the break DOWN</text>

<rect class="ibz" x="796" y="170" width="200" height="250"/>
<text class="ts" x="796" y="163">IB WINDOW 09:30–10:30 ET</text>
<line class="ibs dash" x1="996" y1="150" x2="996" y2="470" stroke-width="1"/>
<text class="ts" x="1002" y="163">10:30 — decide here</text>

<line class="ibs" x1="796" y1="170" x2="1324" y2="170" stroke-width="2"/>
<text class="ib" x="1184" y="164" font-size="12.5">IBH = STOP</text>
<line class="ibs" x1="796" y1="420" x2="1324" y2="420" stroke-width="2"/>
<text class="ib" x="1120" y="437" font-size="12.5">IBL = expected break level = ENTRY trigger</text>

<circle class="sh" cx="834" cy="170" r="6"/>
<text class="sh" x="806" y="158" font-size="12">HIGH FIRST 09:38</text>
<circle class="ib" cx="952" cy="420" r="5"/>
<text class="ts" x="920" y="440" font-size="11.5">low 10:09</text>

<rect class="band" x="796" y="358" width="528" height="62"/>
<text class="ts" x="1036" y="384">0–25% qualifying band (0% at IBL, 100% at IBH)</text>

<g class="can shs">
  <line x1="820" y1="180" x2="820" y2="250"/><line x1="836" y1="170" x2="836" y2="230"/>
  <line x1="856" y1="196" x2="856" y2="262"/><line x1="876" y1="230" x2="876" y2="300"/>
  <line x1="896" y1="266" x2="896" y2="332"/><line x1="916" y1="300" x2="916" y2="364"/>
  <line x1="936" y1="340" x2="936" y2="400"/><line x1="952" y1="366" x2="952" y2="420"/>
  <line x1="970" y1="372" x2="970" y2="412"/><line x1="988" y1="378" x2="988" y2="406"/>
</g>
<circle cx="992" cy="396" r="5" fill="#eef2f7"/>
<text class="t" x="1010" y="418" font-size="12">10:30 close sits INSIDE the band</text>
<text class="ts" x="1010" y="435">EZ = 100 × |close − IBL| ÷ (IBH − IBL) = 9.6%  →  QUALIFIED</text>

<g class="can shs">
  <line x1="1024" y1="386" x2="1024" y2="432"/><line x1="1044" y1="410" x2="1044" y2="452"/>
  <line x1="1066" y1="424" x2="1066" y2="466"/>
</g>
<circle class="sh" cx="1024" cy="424" r="6"/>
<text class="sh" x="1032" y="474" font-size="12.5">ENTRY — first bar after 10:30 whose LOW breaks below IBL</text>
<text class="ts" x="1032" y="490">fill = min(IBL, bar open)</text>

<line class="tgs" x1="1024" y1="502" x2="1324" y2="502" stroke-width="2"/>
<text class="tg" x="1120" y="518" font-size="12.5">1R TARGET = fill − (IBH − fill)</text>
<line class="sts dash" x1="1024" y1="170" x2="1324" y2="170" stroke-width="1.5"/>
<text class="sh" x="1140" y="186" font-size="12.5">risk = IBH − fill</text>
<text class="ts" x="1240" y="470">flat 16:00 ET</text>

<!-- ================= INVALIDATION ================= -->
<rect class="pan" x="28" y="600" width="660" height="150" rx="4"/>
<text class="h" x="48" y="628">INVALIDATED — no trade, even though it qualified</text>
<text class="t" x="48" y="656">If the OPPOSITE boundary — the stop level — is touched BEFORE the</text>
<text class="t" x="48" y="676">expected level breaks, the frozen rule takes no trade. The stop was</text>
<text class="t" x="48" y="696">violated before entry, so there was never a valid position to hold.</text>
<text class="ts" x="48" y="722">Long example: price trades below IBL before ever exceeding IBH  →  INVALIDATED.</text>
<text class="ts" x="48" y="740">This is not a loss. It is a session that produced no trade. Log it as such.</text>

<!-- ================= STATE MACHINE ================= -->
<rect class="pan" x="712" y="600" width="660" height="150" rx="4"/>
<text class="h" x="732" y="628">STATE MACHINE on the panel</text>
<text class="t" x="732" y="656"><tspan class="sub">FORMING</tspan>  09:30–10:30, IB still building</text>
<text class="t" x="732" y="676"><tspan class="lg">QUALIFIED</tspan>  the 10:30 bar: EZ &lt; 25% and the extremes are on different bars</text>
<text class="t" x="732" y="696"><tspan class="lg">ARMED</tspan>  waiting for the expected level to break</text>
<text class="t" x="732" y="716"><tspan class="lg">TRIGGERED</tspan>  filled; stop and 1R target drawn</text>
<text class="t" x="732" y="736"><tspan class="sh">INVALIDATED</tspan> opposite side first    <tspan class="ts">NO TRADE</tspan> EZ ≥ 25%, same-bar extremes, or no break by 16:00</text>

<!-- ================= DECISION LIST ================= -->
<rect class="pan" x="28" y="764" width="1344" height="200" rx="4"/>
<text class="h" x="48" y="792">THE DECISION LIST</text>

<text class="t" x="48" y="820" font-weight="600">At 10:30, check four things</text>
<text class="ts" x="48" y="840">1  Are IBH and IBL on DIFFERENT bars? Same bar → NO TRADE.</text>
<text class="ts" x="48" y="858">2  Which formed FIRST? High first → short. Low first → long.</text>
<text class="ts" x="48" y="876">3  Is EZ &lt; 25%? Measured from the EXPECTED break side.</text>
<text class="ts" x="48" y="894">4  Is the chart on 1-MINUTE bars and is the window really 09:30–10:30 ET?</text>
<text class="ts" x="48" y="912">   Check daylight saving every March and November.</text>

<text class="t" x="500" y="820" font-weight="600">What makes it a NO TRADE</text>
<text class="ts" x="500" y="840">• EZ ≥ 25%   • both extremes on one bar   • IB range zero</text>
<text class="ts" x="500" y="858">• fewer than 30 IB bars</text>
<text class="ts" x="500" y="876">• opposite boundary breaks first → INVALIDATED</text>
<text class="ts" x="500" y="894">• the expected level never breaks before 16:00</text>
<text class="ts" x="500" y="912">Log every one of these. The no-trade days are part of the record.</text>

<text class="t" x="940" y="820" font-weight="600">Orders</text>
<text class="ts" x="940" y="840">ENTRY  buy-stop at IBH (long) or sell-stop at IBL (short), working from 10:30.</text>
<text class="ts" x="940" y="858">STOP   the opposite IB boundary. Not a tick tighter — the width IS the rule.</text>
<text class="ts" x="940" y="876">TARGET 1R from the actual fill, not from the trigger level.</text>
<text class="ts" x="940" y="894">FLAT   16:00 ET, unconditionally, whatever the position is doing.</text>
<text class="ts" x="940" y="912">ONE trade per session. The frozen candidate is the single-entry version.</text>

<text class="sub" x="48" y="948">The backtest excludes the ENTRY BAR from the exit search, so a stop touched on the entry bar does not appear there. Live it can. Log what actually happened and flag the divergence.</text>
</svg>
